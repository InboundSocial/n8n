app = "n8n-deply-1000x"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  N8N_EDITOR_BASE_URL = "https://automation.1000xsales.com"
  N8N_HOST = "0.0.0.0"
  N8N_PORT = "5678"
  N8N_PROTOCOL = "https"
  N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN = "true"
  WEBHOOK_URL = "https://automation.1000xsales.com"
  N8N_DISABLE_PRODUCTION_MAIN_PROCESS = "true"


[http_service]
  internal_port = 5678
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "n8n_data"
  destination = "/home/node/.n8n"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2048"

